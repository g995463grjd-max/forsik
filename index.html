<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsic - Рабочий чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0088cc; }
        .app { width: 1000px; margin: 20px auto; background: white; border-radius: 10px; overflow: hidden; }
        .header { background: #0088cc; color: white; padding: 20px; text-align: center; }
        .chat-area { display: flex; height: 600px; }
        .sidebar { width: 300px; background: #f5f5f5; border-right: 1px solid #ddd; }
        .main-chat { flex: 1; display: flex; flex-direction: column; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; }
        .input-area { padding: 15px; border-top: 1px solid #ddd; display: flex; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; }
        button { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-left: 10px; cursor: pointer; }
        .chat-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .chat-item:hover { background: #e9ecef; }
        .message { margin: 10px 0; padding: 10px; border-radius: 10px; max-width: 70%; }
        .my { background: #0088cc; color: white; margin-left: auto; }
        .other { background: #e5e5ea; margin-right: auto; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>💬 Forsic - Рабочий чат</h1>
            <p>Общайтесь в реальном времени</p>
        </div>
        <div class="chat-area">
            <div class="sidebar">
                <div style="padding: 15px;">
                    <input type="text" placeholder="Поиск чатов" style="width: 100%; padding: 8px;">
                </div>
                <div id="chatsList">
                    <!-- Чаты появятся здесь -->
                </div>
            </div>
            <div class="main-chat">
                <div class="messages" id="messages">
                    <div style="text-align: center; padding: 50px;">
                        <h3>Добро пожаловать в Forsic!</h3>
                        <p>Выберите чат слева или создайте новый</p>
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Введите сообщение...">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Данные пользователей
        const users = [
            { id: 1, name: "Алексей", online: true },
            { id: 2, name: "Мария", online: true },
            { id: 3, name: "Иван", online: false },
            { id: 4, name: "Ольга", online: true }
        ];
        
        // Текущий пользователь
        let currentUser = null;
        let currentChat = null;
        
        // Инициализация
        window.onload = function() {
            // Запрашиваем имя
            const userName = prompt("Введите ваше имя:", "Гость");
            currentUser = { id: 0, name: userName, online: true };
            
            // Загружаем чаты
            loadChats();
            
            // Показываем уведомление
            alert("Добро пожаловать, " + userName + "!");
        };
        
        // Загрузить чаты
        function loadChats() {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';
            
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <strong>${user.name}</strong>
                    <span style="float: right; color: ${user.online ? 'green' : 'gray'}; font-size: 12px;">
                        ${user.online ? '🟢' : '⚫'}
                    </span>
                    <p style="color: gray; font-size: 12px;">${user.online ? 'онлайн' : 'оффлайн'}</p>
                `;
                div.onclick = () => openChat(user);
                chatsList.appendChild(div);
            });
        }
        
        // Открыть чат
        function openChat(user) {
            currentChat = user;
            
            // Обновляем заголовок
            document.querySelector('.header h1').innerHTML = `💬 Чат с ${user.name}`;
            
            // Загружаем сообщения
            const messages = document.getElementById('messages');
            messages.innerHTML = `
                <div class="message other">
                    <strong>${user.name}</strong><br>
                    Привет! Как дела?
                </div>
                <div class="message my">
                    <strong>${currentUser.name}</strong><br>
                    Привет! Хорошо, а у тебя?
                </div>
            `;
            
            // Прокручиваем вниз
            messages.scrollTop = messages.scrollHeight;
        }
        
        // Отправить сообщение
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            if (!currentChat) {
                alert("Сначала выберите чат!");
                return;
            }
            
            const messages = document.getElementById('messages');
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Добавляем наше сообщение
            const myMsg = document.createElement('div');
            myMsg.className = 'message my';
            myMsg.innerHTML = `<strong>${currentUser.name}</strong><br>${text}<br><small>${time}</small>`;
            messages.appendChild(myMsg);
            
            input.value = '';
            
            // Имитация ответа через 1-2 секунды
            setTimeout(() => {
                const replies = [
                    "Привет! Как дела?",
                    "Интересно...",
                    "Давай обсудим это",
                    "Согласен!",
                    "Спасибо за сообщение!"
                ];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                
                const theirMsg = document.createElement('div');
                theirMsg.className = 'message other';
                theirMsg.innerHTML = `<strong>${currentChat.name}</strong><br>${reply}<br><small>${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>`;
                messages.appendChild(theirMsg);
                
                // Прокручиваем вниз
                messages.scrollTop = messages.scrollHeight;
            }, 1000 + Math.random() * 1000);
        }
        
        // Отправка по Enter
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
